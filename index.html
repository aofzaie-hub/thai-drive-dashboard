<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thai Drive Dashboard v0.2</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#05070b',
                            card: '#0f172a',
                            border: '#1e293b',
                            cyan: '#00f0ff',
                            blue: '#0066ff',
                            glow: 'rgba(0, 240, 255, 0.15)'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Prompt', 'Inter', sans-serif;
            background-color: #05070b;
            color: #f8fafc;
            user-select: none;
            overflow: hidden;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b1120;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00f0ff;
        }
        .glow-box {
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.08);
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden bg-cyber-bg">

    <!-- Top Navigation Bar -->
    <header class="h-14 bg-[#0a0f1d]/90 backdrop-blur-md border-b border-cyan-500/20 px-4 flex items-center justify-between z-50 shrink-0">
        <!-- Brand & Status -->
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_10px_#00f0ff]"></div>
                <h1 class="font-bold text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 glow-text">
                    THAI DRIVE <span class="text-xs px-2 py-0.5 rounded bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 font-mono">v0.2</span>
                </h1>
            </div>
            <div class="hidden md:flex items-center space-x-3 text-xs text-slate-400 border-l border-slate-800 pl-4 font-mono">
                <span><i class="fa-solid fa-wifi text-cyan-400 mr-1"></i> 5G LTE</span>
                <span><i class="fa-solid fa-bluetooth text-blue-400 mr-1"></i> Connected</span>
                <span><i class="fa-solid fa-location-dot text-emerald-400 mr-1"></i> GPS Active</span>
                <span class="flex items-center text-cyan-300"><i class="fa-solid fa-battery-three-quarters mr-1"></i> 85% (450 km)</span>
            </div>
        </div>

        <!-- Layout Ratio & Control Buttons -->
        <div class="flex items-center space-x-2">
            <!-- Ratio Buttons -->
            <div class="flex items-center bg-slate-900/90 border border-cyan-500/30 rounded-lg p-0.5 space-x-1 text-xs shadow-[0_0_10px_rgba(0,240,255,0.1)]">
                <button onclick="setLayoutRatio('50:50')" id="ratio-50-50" class="px-2.5 py-1 rounded transition text-slate-300 hover:text-white font-mono">50:50</button>
                <button onclick="setLayoutRatio('60:40')" id="ratio-60-40" class="px-2.5 py-1 rounded transition text-slate-300 hover:text-white font-mono">60:40</button>
                <button onclick="setLayoutRatio('40:60')" id="ratio-40-60" class="px-2.5 py-1 rounded transition text-slate-300 hover:text-white font-mono">40:60</button>
                <button onclick="setLayoutRatio('70:30')" id="ratio-70-30" class="px-2.5 py-1 rounded transition text-slate-300 hover:text-white font-mono">70:30</button>
                <button onclick="setLayoutRatio('30:70')" id="ratio-30-70" class="px-2.5 py-1 rounded transition text-slate-300 hover:text-white font-mono">30:70</button>
            </div>

            <!-- Swap Button -->
            <button onclick="swapPanes()" title="Swap Left & Right Panels" class="bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 text-cyan-400 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 active:scale-95">
                <i class="fa-solid fa-right-left"></i>
                <span class="hidden sm:inline" data-i18n="swap">สลับจอ</span>
            </button>

            <!-- Language Switcher -->
            <button onclick="toggleLanguage()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center space-x-1 active:scale-95">
                <i class="fa-solid fa-globe text-cyan-400"></i>
                <span id="lang-label">TH</span>
            </button>

            <!-- Clock -->
            <div id="live-clock" class="font-mono text-cyan-400 font-bold text-sm bg-cyan-950/30 border border-cyan-500/20 px-3 py-1 rounded-lg">
                00:00:00
            </div>
        </div>
    </header>

    <!-- Main Split-Screen Workspace -->
    <main id="workspace" class="flex-1 flex overflow-hidden p-2 gap-2 relative">
        <!-- Left Pane -->
        <section id="pane-left" class="flex flex-col bg-cyber-card/75 backdrop-blur border border-cyber-border rounded-xl overflow-hidden transition-all duration-100 relative glow-box" style="width: 50%;">
            <!-- Pane Header with Widget Selector -->
            <div class="bg-slate-900/90 border-b border-slate-800 px-3 py-2 flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-2">
                    <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300" data-i18n="left_pane">Left Pane</h2>
                </div>
                <select id="select-left" onchange="changeWidget('left', this.value)" class="bg-slate-800 border border-slate-700 text-xs text-cyan-300 rounded px-2 py-1 focus:outline-none focus:border-cyan-500">
                    <option value="vehicle" data-i18n="w_vehicle">🚘 Vehicle Hub / สถานะรถ</option>
                    <option value="weather" data-i18n="w_weather">🌤 Weather / สภาพอากาศ</option>
                    <option value="map" data-i18n="w_map">🗺 Navigation / แผนที่</option>
                    <option value="youtube" data-i18n="w_youtube">▶ YouTube / สื่อวิดีโอ</option>
                    <option value="iptv" data-i18n="w_iptv">📺 Thai IPTV / ทีวีไทย</option>
                </select>
            </div>
            <!-- Pane Content Container -->
            <div id="content-left" class="flex-1 overflow-y-auto p-3 relative flex flex-col">
                <!-- Rendered dynamically -->
            </div>
        </section>

        <!-- Interactive Drag Resizer Handle -->
        <div id="resizer" title="Drag to resize screens" class="w-2 bg-slate-900 hover:bg-cyan-500/50 active:bg-cyan-400 cursor-col-resize rounded-full transition flex items-center justify-center shrink-0 z-20 group border border-slate-800">
            <div class="w-0.5 h-10 bg-slate-600 group-hover:bg-cyan-300 rounded-full"></div>
        </div>

        <!-- Right Pane -->
        <section id="pane-right" class="flex flex-col bg-cyber-card/75 backdrop-blur border border-cyber-border rounded-xl overflow-hidden transition-all duration-100 relative glow-box flex-1">
            <!-- Pane Header with Widget Selector -->
            <div class="bg-slate-900/90 border-b border-slate-800 px-3 py-2 flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-2">
                    <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300" data-i18n="right_pane">Right Pane</h2>
                </div>
                <select id="select-right" onchange="changeWidget('right', this.value)" class="bg-slate-800 border border-slate-700 text-xs text-blue-300 rounded px-2 py-1 focus:outline-none focus:border-blue-500">
                    <option value="map" data-i18n="w_map">🗺 Navigation / แผนที่</option>
                    <option value="vehicle" data-i18n="w_vehicle">🚘 Vehicle Hub / สถานะรถ</option>
                    <option value="weather" data-i18n="w_weather">🌤 Weather / สภาพอากาศ</option>
                    <option value="youtube" data-i18n="w_youtube">▶ YouTube / สื่อวิดีโอ</option>
                    <option value="iptv" data-i18n="w_iptv">📺 Thai IPTV / ทีวีไทย</option>
                </select>
            </div>
            <!-- Pane Content Container -->
            <div id="content-right" class="flex-1 overflow-y-auto p-3 relative flex flex-col">
                <!-- Rendered dynamically -->
            </div>
        </section>
    </main>

    <!-- Safety Warning Modal -->
    <div id="safety-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-cyan-500/40 rounded-2xl p-6 max-w-md w-full shadow-2xl text-center space-y-4">
            <div class="w-16 h-16 bg-amber-500/10 border border-amber-500/30 text-amber-400 rounded-full flex items-center justify-center mx-auto text-2xl animate-bounce">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-lg font-bold text-white" data-i18n="modal_title">คำเตือนความปลอดภัยขณะขับรถ</h3>
            <p class="text-xs text-slate-300 leading-relaxed" data-i18n="modal_desc">
                ระบบจำกัดการรับชมวิดีโอขณะรถกำลังเคลื่อนที่ โปรดใช้ความระมัดระวังและปฏิบัติตามกฎจราจรอย่างเคร่งครัด
            </p>
            <button onclick="closeSafetyModal()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold py-3 rounded-xl text-sm transition hover:opacity-95 shadow-[0_0_15px_rgba(0,240,255,0.4)]">
                <span data-i18n="modal_btn">ฉันจอดรถแล้ว / ยืนยันใช้งาน</span>
            </button>
        </div>
    </div>

    <!-- Custom Message Box Modal -->
    <div id="message-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full text-center space-y-3 shadow-xl">
            <div id="msg-icon" class="text-3xl text-cyan-400 mb-1"><i class="fa-solid fa-circle-info"></i></div>
            <h4 id="msg-title" class="font-bold text-white text-base">แจ้งเตือน</h4>
            <p id="msg-text" class="text-xs text-slate-300"></p>
            <button onclick="closeMsgModal()" class="mt-2 w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-2 rounded-lg text-xs transition">
                ตกลง / OK
            </button>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let currentLang = localStorage.getItem('thai_drive_lang') || 'th';
        let currentRatio = localStorage.getItem('thai_drive_ratio') || '50:50';
        let activeWidgets = {
            left: localStorage.getItem('thai_drive_left') || 'vehicle',
            right: localStorage.getItem('thai_drive_right') || 'map'
        };

        const translations = {
            th: {
                swap: "สลับจอ",
                left_pane: "หน้าจอซ้าย",
                right_pane: "หน้าจอขวา",
                w_vehicle: "🚘 Vehicle Hub / สถานะรถ",
                w_weather: "🌤 Weather / สภาพอากาศ",
                w_map: "🗺 Navigation / แผนที่",
                w_youtube: "▶ YouTube / สื่อวิดีโอ",
                w_iptv: "📺 Thai IPTV / ทีวีไทย",
                modal_title: "คำเตือนความปลอดภัยขณะขับรถ",
                modal_desc: "ระบบจำกัดการรับชมวิดีโอขณะรถกำลังเคลื่อนที่ โปรดใช้ความระมัดระวังและปฏิบัติตามกฎจราจรอย่างเคร่งครัด",
                modal_btn: "ฉันจอดรถแล้ว / ยืนยันใช้งาน",
                speed: "ความเร็ว",
                gear: "เกียร์",
                battery: "แบตเตอรี่ EV",
                range: "ระยะทางวิ่ง",
                tire: "แรงดันยาง",
                psi: "PSI (ปกติ)",
                weather_title: "สภาพอากาศประเทศไทย",
                temp: "อุณหภูมิ",
                humidity: "ความชื้น",
                rain: "โอกาสฝนตก",
                wind: "ความเร็วลม",
                select_province: "เลือกจังหวัด:",
                search_map: "ค้นหาสถานที่ / สถานีชาร์จ EV...",
                play: "เล่น",
                pause: "พัก",
                next: "ถัดไป",
                prev: "ก่อนหน้า"
            },
            en: {
                swap: "Swap",
                left_pane: "Left Pane",
                right_pane: "Right Pane",
                w_vehicle: "🚘 Vehicle Hub / Car Status",
                w_weather: "🌤 Weather Forecast",
                w_map: "🗺 Navigation / Map",
                w_youtube: "▶ YouTube / Media",
                w_iptv: "📺 Thai IPTV Channels",
                modal_title: "Driving Safety Warning",
                modal_desc: "Video playback while driving is restricted. Please ensure safety and obey traffic regulations.",
                modal_btn: "Parked / Confirm Access",
                speed: "Speed",
                gear: "Gear",
                battery: "EV Battery",
                range: "Range",
                tire: "Tire Pressure",
                psi: "PSI (Normal)",
                weather_title: "Thailand Weather",
                temp: "Temperature",
                humidity: "Humidity",
                rain: "Rain Chance",
                wind: "Wind Speed",
                select_province: "Select Province:",
                search_map: "Search place / EV Charging Station...",
                play: "Play",
                pause: "Pause",
                next: "Next",
                prev: "Previous"
            }
        };

        window.onload = function() {
            applyLanguage();
            setLayoutRatio(currentRatio);
            initClock();
            initResizer();
            
            document.getElementById('select-left').value = activeWidgets.left;
            document.getElementById('select-right').value = activeWidgets.right;

            renderWidget('left', activeWidgets.left);
            renderWidget('right', activeWidgets.right);
        };

        function initResizer() {
            const resizer = document.getElementById('resizer');
            const workspace = document.getElementById('workspace');
            const leftPane = document.getElementById('pane-left');
            const rightPane = document.getElementById('pane-right');

            let isDragging = false;

            const onMouseDown = (e) => {
                isDragging = true;
                document.body.style.cursor = 'col-resize';
                e.preventDefault();
            };

            const onMouseMove = (e) => {
                if (!isDragging) return;
                const workspaceRect = workspace.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let newLeftWidth = clientX - workspaceRect.left;
                
                const minWidth = workspaceRect.width * 0.2;
                const maxWidth = workspaceRect.width * 0.8;

                if (newLeftWidth < minWidth) newLeftWidth = minWidth;
                if (newLeftWidth > maxWidth) newLeftWidth = maxWidth;

                const leftPercent = (newLeftWidth / workspaceRect.width) * 100;
                const rightPercent = 100 - leftPercent;

                leftPane.style.width = `${leftPercent}%`;
                rightPane.style.width = `${rightPercent}%`;
                leftPane.style.flex = 'none';
                rightPane.style.flex = 'none';
            };

            const onMouseUp = () => {
                if (isDragging) {
                    isDragging = false;
                    document.body.style.cursor = 'default';
                }
            };

            resizer.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);

            resizer.addEventListener('touchstart', onMouseDown);
            window.addEventListener('touchmove', onMouseMove);
            window.addEventListener('touchend', onMouseUp);
        }

        function initClock() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0];
            }, 1000);
        }

        function toggleLanguage() {
            currentLang = currentLang === 'th' ? 'en' : 'th';
            localStorage.setItem('thai_drive_lang', currentLang);
            document.getElementById('lang-label').innerText = currentLang.toUpperCase();
            applyLanguage();
            renderWidget('left', activeWidgets.left);
            renderWidget('right', activeWidgets.right);
        }

        function applyLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });
            document.querySelectorAll('option[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });
        }

        function setLayoutRatio(ratio) {
            currentRatio = ratio;
            localStorage.setItem('thai_drive_ratio', ratio);
            
            ['50-50', '60-40', '40-60', '70-30', '30-70'].forEach(r => {
                const btn = document.getElementById(`ratio-${r}`);
                if(btn) {
                    if(r === ratio.replace(':', '-')) {
                        btn.className = "px-2.5 py-1 rounded transition bg-cyan-500 text-slate-950 font-bold shadow-[0_0_10px_#00f0ff]";
                    } else {
                        btn.className = "px-2.5 py-1 rounded transition text-slate-300 hover:text-white";
                    }
                }
            });

            const leftPane = document.getElementById('pane-left');
            const rightPane = document.getElementById('pane-right');

            leftPane.style.flex = 'none';
            rightPane.style.flex = 'none';

            switch(ratio) {
                case '50:50': leftPane.style.width = '50%'; rightPane.style.width = '50%'; break;
                case '60:40': leftPane.style.width = '60%'; rightPane.style.width = '40%'; break;
                case '40:60': leftPane.style.width = '40%'; rightPane.style.width = '60%'; break;
                case '70:30': leftPane.style.width = '70%'; rightPane.style.width = '30%'; break;
                case '30:70': leftPane.style.width = '30%'; rightPane.style.width = '70%'; break;
            }
        }

        function swapPanes() {
            const temp = activeWidgets.left;
            activeWidgets.left = activeWidgets.right;
            activeWidgets.right = temp;

            localStorage.setItem('thai_drive_left', activeWidgets.left);
            localStorage.setItem('thai_drive_right', activeWidgets.right);

            document.getElementById('select-left').value = activeWidgets.left;
            document.getElementById('select-right').value = activeWidgets.right;

            renderWidget('left', activeWidgets.left);
            renderWidget('right', activeWidgets.right);
        }

        function changeWidget(pane, widgetType) {
            activeWidgets[pane] = widgetType;
            localStorage.setItem(`thai_drive_${pane}`, widgetType);
            renderWidget(pane, widgetType);
        }

        function renderWidget(pane, type) {
            const container = document.getElementById(`content-${pane}`);
            container.innerHTML = '';

            switch(type) {
                case 'vehicle':
                    container.innerHTML = getVehicleHubHTML();
                    initVehicleInteractivity();
                    break;
                case 'weather':
                    container.innerHTML = getWeatherHTML();
                    fetchWeatherData('Bangkok', pane);
                    break;
                case 'map':
                    container.innerHTML = getMapHTML();
                    break;
                case 'youtube':
                    container.innerHTML = getYouTubeHTML();
                    break;
                case 'iptv':
                    container.innerHTML = getIPTVHTML();
                    break;
            }
        }

        function getVehicleHubHTML() {
            return `
                <div class="h-full flex flex-col justify-between space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-3 flex flex-col items-center justify-center relative">
                            <span class="text-xs text-slate-400 mb-1" data-i18n="speed">ความเร็ว (Speed)</span>
                            <div class="text-4xl font-black font-mono text-cyan-400 glow-text" id="speed-display">0</div>
                            <span class="text-[10px] text-slate-500 mt-0.5">KM/H</span>
                            <input type="range" min="0" max="160" value="0" oninput="updateSpeed(this.value)" class="w-full mt-2 accent-cyan-400 cursor-pointer">
                        </div>
                        <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-3 flex flex-col items-center justify-center">
                            <span class="text-xs text-slate-400 mb-1" data-i18n="gear">เกียร์ (Gear)</span>
                            <div class="flex space-x-2 my-2">
                                <span class="gear-btn px-3 py-1 rounded bg-slate-800 text-slate-400 font-bold text-xs" data-gear="P">P</span>
                                <span class="gear-btn px-3 py-1 rounded bg-slate-800 text-slate-400 font-bold text-xs" data-gear="R">R</span>
                                <span class="gear-btn px-3 py-1 rounded bg-slate-800 text-slate-400 font-bold text-xs" data-gear="N">N</span>
                                <span class="gear-btn px-3 py-1 rounded bg-cyan-500 text-slate-950 font-bold text-xs shadow-[0_0_10px_#00f0ff]" data-gear="D">D</span>
                            </div>
                            <span class="text-[10px] text-emerald-400 mt-1"><i class="fa-solid fa-bolt"></i> EV Powertrain Active</span>
                        </div>
                    </div>

                    <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-3">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-semibold text-slate-300" data-i18n="battery">แบตเตอรี่ EV (85%)</span>
                            <span class="text-xs text-cyan-400 font-mono">450 km <span class="text-slate-500" data-i18n="range">ระยะทาง</span></span>
                        </div>
                        <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden p-0.5 border border-slate-700">
                            <div class="bg-gradient-to-r from-cyan-500 to-blue-500 h-full rounded-full w-[85%] shadow-[0_0_10px_#00f0ff]"></div>
                        </div>
                    </div>

                    <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-3">
                        <div class="text-xs font-semibold text-slate-300 mb-2 flex items-center justify-between">
                            <span data-i18n="tire">แรงดันยาง (Tire Pressure)</span>
                            <span class="text-[10px] text-emerald-400"><i class="fa-solid fa-circle-check"></i> Normal</span>

        function fetchWeatherData(province) {
            const locEl = document.getElementById('weather-location');
            if(locEl) locEl.innerText = province;
            
            const coords = {
                'Bangkok': { lat: 13.7563, lon: 100.5018 },
                'Nakhon Ratchasima': { lat: 14.9799, lon: 102.0978 },
                'Chiang Mai': { lat: 18.7883, lon: 98.9853 },
                'Phuket': { lat: 7.8804, lon: 98.3923 }
            };

            const target = coords[province] || coords['Bangkok'];
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=${target.lat}&longitude=${target.lon}&current_weather=true`)
                .then(res => res.json())
                .then(data => {
                    if(data && data.current_weather) {
                        const temp = Math.round(data.current_weather.temperature);
                        const wind = data.current_weather.windspeed;
                        const tempEl = document.getElementById('weather-temp');
                        const windEl = document.getElementById('weather-wind');
                        if(tempEl) tempEl.innerText = `${temp}°C`;
                        if(windEl) windEl.innerText = `${wind} km/h`;
                    }
                })
                .catch(() => {});
        }

        function searchGoogleMap() {
            const query = document.getElementById('map-search-input').value;
            if(!query) return;
            const iframe = document.getElementById('google-map-iframe');
            const statusText = document.getElementById('map-status-text');
            if(iframe) {
                iframe.src = `https://maps.google.com/maps?q=${encodeURIComponent(query)}&t=&z=14&ie=UTF8&iwloc=&output=embed`;
            }
            if(statusText) {
                statusText.innerText = `ค้นหา: ${query}`;
            }
        }

        function filterMap(keyword) {
            document.getElementById('map-search-input').value = keyword;

        function getUserGPSLocation() {
            const statusText = document.getElementById('map-status-text');
            if(statusText) statusText.innerText = "กำลังค้นหาพิกัด GPS...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const iframe = document.getElementById('google-map-iframe');
                        if(iframe) {
                            iframe.src = `https://maps.google.com/maps?q=${lat},${lon}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
                        }
                        if(statusText) statusText.innerText = `พิกัดปัจจุบัน: ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
                    },
                    (error) => {
                        showMsgModal("GPS Error", "ไม่สามารถดึงตำแหน่งปัจจุบันได้ กรุณาเปิดสิทธิ์ระบุตำแหน่งใน Browser");
                        if(statusText) statusText.innerText = "ไม่พบพิกัด GPS";
                    }
                );
            } else {
                showMsgModal("Not Supported", "เบราว์เซอร์นี้ไม่รองรับการดึงพิกัด Geolocation");
            }
        }

        function extractYouTubeId(urlOrId) {
            if (!urlOrId) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = urlOrId.match(regExp);
            return (match && match[2].length === 11) ? match[2] : urlOrId;
        }

        function playCustomYouTube() {
            const input = document.getElementById('yt-search-input').value.trim();
            if(!input) return;
            openSafetyModal();

            const videoId = extractYouTubeId(input);
            if(videoId && videoId.length === 11) {
                loadYouTubeVideo(videoId, `กำลังเล่น: ${videoId}`);
            } else {
                const iframe = document.getElementById('youtube-player-iframe');
                const statusTitle = document.getElementById('yt-status-title');
                if(iframe) {
                    iframe.src = `https://www.youtube-nocookie.com/embed?listType=search&list=${encodeURIComponent(input)}&autoplay=1`;
                }
                if(statusTitle) {
                    statusTitle.innerText = `ค้นหา: ${input}`;
                }
            }
        }

        function loadYouTubeVideo(videoId, title) {
            openSafetyModal();
            const iframe = document.getElementById('youtube-player-iframe');

                statusTitle.innerText = title;

        }
